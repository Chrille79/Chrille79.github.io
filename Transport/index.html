<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transport Terrain — Phase 1</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: system-ui, sans-serif; }
      #gpu { width: 100%; height: 100%; display: block; }
      #help {
        position: fixed; left: 12px; top: 12px; padding: 10px 12px;
        background: rgba(8, 12, 28, 0.6); color: #cdd6f4; border-radius: 8px;
        font-size: 12px; line-height: 1.5; pointer-events: none; user-select: none;
        backdrop-filter: blur(4px);
      }
      #help b { color: #f9e2af; }
      #hud {
        position: fixed; right: 12px; top: 12px; padding: 8px 12px;
        background: rgba(8, 12, 28, 0.6); color: #cdd6f4; border-radius: 8px;
        font-size: 13px; line-height: 1.5; pointer-events: none; user-select: none;
        backdrop-filter: blur(4px); text-align: right;
      }
      #hud b { color: #a6e3a1; }
      #info {
        position: fixed; left: 12px; top: 64px; min-width: 150px; max-width: 240px;
        padding: 10px 12px; background: rgba(8, 12, 28, 0.78); color: #cdd6f4;
        border-radius: 8px; border: 1px solid #313244; font-size: 12px; line-height: 1.6;
        pointer-events: auto; user-select: none; backdrop-filter: blur(4px);
      }
      #info[hidden] { display: none; }
      #info b { color: #f9e2af; font-size: 13px; }
      #info .hint { color: #89b4fa; font-style: italic; }
      #info .actions { display: flex; gap: 6px; margin-top: 8px; }
      #info button {
        flex: 1; padding: 5px 8px; font-size: 12px; cursor: pointer;
        border: 1px solid #45475a; border-radius: 6px;
        background: rgba(255,255,255,0.08); color: #cdd6f4;
      }
      #info button:hover { background: rgba(255,255,255,0.16); }
      #info button.sell { color: #f38ba8; border-color: #5c3a44; }
      /* Main menu (left) + contextual part palette (bottom). */
      #categories {
        position: fixed; left: 16px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 6px; padding: 6px;
        background: rgba(8, 12, 28, 0.7); border-radius: 10px;
        backdrop-filter: blur(4px); user-select: none;
      }
      #palette {
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 6px;
        background: rgba(8, 12, 28, 0.7); border-radius: 10px;
        backdrop-filter: blur(4px); user-select: none;
      }
      #palette:empty { display: none; }
      #categories button, #palette button {
        width: 48px; height: 48px; font-size: 22px; line-height: 1;
        border: 1px solid transparent; border-radius: 8px; cursor: pointer;
        background: rgba(255, 255, 255, 0.06); color: #cdd6f4;
      }
      #categories button:hover, #palette button:hover { background: rgba(255, 255, 255, 0.14); }
      #categories button.active { background: #585b70; border-color: #7f849c; }
      #palette button.active { background: #89b4fa; color: #0b1020; border-color: #b4d0ff; }
      /* Bottom-left transport controls: start/stop + cassette-style speed. */
      #speedbar {
        position: fixed; left: 16px; bottom: 16px;
        display: flex; gap: 4px; padding: 5px;
        background: rgba(8, 12, 28, 0.7); border-radius: 10px;
        backdrop-filter: blur(4px); user-select: none;
      }
      #speedbar button {
        min-width: 40px; height: 40px; font-size: 16px; line-height: 1;
        border: 1px solid transparent; border-radius: 8px; cursor: pointer;
        background: rgba(255, 255, 255, 0.06); color: #cdd6f4;
      }
      #speedbar button:hover { background: rgba(255, 255, 255, 0.14); }
      #speedbar button.active { background: #89b4fa; color: #0b1020; border-color: #b4d0ff; }
      /* Depot buy list. */
      #buylist {
        position: fixed; left: 50%; top: 80px; transform: translateX(-50%);
        min-width: 240px; padding: 10px 14px; z-index: 20;
        background: rgba(8, 12, 28, 0.92); color: #cdd6f4;
        border-radius: 8px; border: 1px solid #313244; font-size: 13px;
        pointer-events: auto; user-select: none; backdrop-filter: blur(4px);
      }
      #buylist[hidden] { display: none; }
      #buylist h4 { margin: 0 0 8px; font-size: 13px; color: #f9e2af; }
      #buylist .row { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
      #buylist .row span { flex: 1; }
      #buylist button {
        padding: 4px 10px; font-size: 12px; cursor: pointer;
        border: 1px solid #45475a; border-radius: 6px;
        background: rgba(255, 255, 255, 0.08); color: #cdd6f4;
      }
      #buylist button:hover { background: rgba(255, 255, 255, 0.16); }
      #buylist button:disabled { opacity: 0.4; cursor: default; }
      #buylist .close { float: right; padding: 1px 7px; }
      /* Order editor (top-right): a train's ordered station loop. */
      #orderlist {
        position: fixed; right: 12px; top: 80px;
        min-width: 220px; max-width: 280px; padding: 10px 14px; z-index: 20;
        background: rgba(8, 12, 28, 0.92); color: #cdd6f4;
        border-radius: 8px; border: 1px solid #313244; font-size: 13px;
        pointer-events: auto; user-select: none; backdrop-filter: blur(4px);
      }
      #orderlist[hidden] { display: none; }
      #orderlist h4 { margin: 0 0 8px; font-size: 13px; color: #f9e2af; }
      #orderlist .row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
      #orderlist .row span { flex: 1; }
      #orderlist .hint { color: #7f849c; font-size: 11px; margin: 6px 0; }
      #orderlist .actions { margin-top: 8px; }
      #orderlist button {
        padding: 3px 9px; font-size: 12px; cursor: pointer;
        border: 1px solid #45475a; border-radius: 6px;
        background: rgba(255, 255, 255, 0.08); color: #cdd6f4;
      }
      #orderlist button:hover { background: rgba(255, 255, 255, 0.16); }
      #orderlist .close { float: right; padding: 1px 7px; }
      /* Finance panel (bottom-right): company value, goal, loan. */
      #finance {
        position: fixed; right: 12px; bottom: 12px; padding: 8px 12px;
        background: rgba(8, 12, 28, 0.7); color: #cdd6f4; border-radius: 8px;
        font-size: 12px; line-height: 1.6; user-select: none; backdrop-filter: blur(4px);
      }
      #finance b { color: #a6e3a1; }
      #finance .loan { margin-top: 4px; }
      #finance button {
        padding: 2px 8px; font-size: 11px; cursor: pointer; margin-left: 5px;
        border: 1px solid #45475a; border-radius: 6px;
        background: rgba(255, 255, 255, 0.08); color: #cdd6f4;
      }
      #finance button:hover { background: rgba(255, 255, 255, 0.16); }
      /* Top-center overview/statistics buttons + panel. */
      #overbar {
        position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 5px;
        background: rgba(8, 12, 28, 0.7); border-radius: 10px;
        backdrop-filter: blur(4px); user-select: none;
      }
      #overbar button {
        height: 36px; padding: 0 14px; font-size: 13px; line-height: 1;
        border: 1px solid transparent; border-radius: 8px; cursor: pointer;
        background: rgba(255, 255, 255, 0.06); color: #cdd6f4;
      }
      #overbar button:hover { background: rgba(255, 255, 255, 0.14); }
      #overbar button.active { background: #585b70; border-color: #7f849c; }
      #overview {
        position: fixed; left: 50%; top: 58px; transform: translateX(-50%);
        width: 460px; max-height: 72vh; overflow-y: auto; padding: 14px 16px; z-index: 25;
        background: rgba(8, 12, 28, 0.95); color: #cdd6f4;
        border-radius: 10px; border: 1px solid #313244; font-size: 13px; line-height: 1.6;
        user-select: none; backdrop-filter: blur(6px);
      }
      #overview[hidden] { display: none; }
      #overview h3 { margin: 0 0 8px; font-size: 15px; color: #f9e2af; }
      #overview .close { float: right; cursor: pointer; padding: 1px 8px; border: 1px solid #45475a;
        border-radius: 6px; background: rgba(255,255,255,0.08); color: #cdd6f4; }
      #overview table { width: 100%; border-collapse: collapse; margin-top: 6px; }
      #overview td { padding: 1px 4px; }
      #overview td.r { text-align: right; }
      #overview .filt { display: flex; gap: 5px; margin: 8px 0; }
      #overview .filt button { padding: 3px 9px; font-size: 12px; cursor: pointer;
        border: 1px solid #45475a; border-radius: 6px; background: rgba(255,255,255,0.08); color: #cdd6f4; }
      #overview .filt button.active { background: #89b4fa; color: #0b1020; }
      #overview .row { display: flex; gap: 8px; padding: 3px 5px; border-radius: 5px; }
      #overview .row[data-sel] { cursor: pointer; }
      #overview .row:hover { background: rgba(255,255,255,0.08); }
      #overview .row span:first-child { flex: 1; }
      #overview .pos { color: #a6e3a1; } #overview .neg { color: #f38ba8; }
      #console {
        position: fixed; left: 0; right: 0; bottom: 0;
        background: rgba(8, 12, 28, 0.92); color: #cdd6f4;
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
        border-top: 1px solid #313244;
      }
      #console-log {
        margin: 0; padding: 8px 10px; height: 150px; overflow-y: auto;
        white-space: pre-wrap; line-height: 1.4;
      }
      #console-input {
        width: 100%; box-sizing: border-box; border: none; outline: none;
        padding: 8px 10px; background: #11162a; color: #a6e3a1;
        font-family: inherit; font-size: 12px; border-top: 1px solid #313244;
      }
      #console[hidden] { display: none; }
      #msg {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center; color: #f38ba8; font-size: 18px; line-height: 1.6;
      }
      #msg[hidden] { display: none; }
      /* Town name labels: absolutely positioned over the canvas, projected from
         world space each frame. Never capture pointer events. */
      #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .town-label {
        position: absolute; transform: translate(-50%, -100%);
        padding: 2px 7px; border-radius: 7px; white-space: nowrap;
        background: rgba(8, 12, 28, 0.62); color: #f5f5f5;
        font-size: 12px; line-height: 1.3; font-weight: 600;
        text-shadow: 0 1px 2px rgba(0,0,0,0.6); backdrop-filter: blur(2px);
        will-change: transform, left, top;
      }
      .town-label .pop { font-weight: 400; opacity: 0.7; margin-left: 5px; font-size: 11px; }
      .station-label { background: rgba(20, 40, 70, 0.72); color: #cfe6ff; }
      .industry-label { background: rgba(50, 35, 20, 0.72); color: #ffdfb0; }
    </style>
    <script type="module" crossorigin src="/Transport/assets/index-ChVf5aRW.js"></script>
  </head>
  <body>
    <canvas id="gpu"></canvas>
    <div id="help">
      <b>A / D</b> rotate &nbsp; <b>W / S</b> tilt &nbsp; <b>wheel</b> zoom &nbsp; <b>arrows</b> pan
    </div>
    <div id="overbar"></div>
    <div id="overview" hidden></div>
    <div id="categories"></div>
    <div id="palette"></div>
    <div id="labels"></div>
    <div id="hud"></div>
    <div id="speedbar"></div>
    <div id="buylist" hidden></div>
    <div id="orderlist" hidden></div>
    <div id="finance"></div>
    <div id="info" hidden></div>
    <div id="msg" hidden></div>
    <div id="console" hidden>
      <pre id="console-log"></pre>
      <input id="console-input" type="text" spellcheck="false"
             placeholder="'settings' or 'game' to browse, '&lt;path&gt; &lt;value&gt;' to set — Esc to close" />
    </div>
  </body>
</html>

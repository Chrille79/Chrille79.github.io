<title>Glimmer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#5fd2f2;font-family:"Trebuchet MS",system-ui,sans-serif}
  canvas{display:block}
  #themes{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  #themes button{font:inherit;font-weight:800;font-size:13px;padding:6px 11px;border-radius:10px;border:2px solid #fff;background:rgba(30,50,70,.45);color:#fff;cursor:pointer}
  #themes button.on{background:#fff;color:#243447}
  #hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);color:#fff;font-weight:800;font-size:14px;background:rgba(30,50,70,.35);padding:6px 12px;border-radius:10px}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800}
  #edit{position:fixed;right:12px;bottom:12px;color:#fff;font-weight:800;font-size:13px;background:rgba(30,50,70,.45);padding:6px 11px;border-radius:10px;border:2px solid #fff;text-decoration:none}
  .embed #themes,.embed #hint,.embed #edit{display:none}
  #perf{display:none;position:fixed;top:0;left:0;right:0;height:24px;align-items:center;gap:18px;padding:0 12px;background:rgba(12,18,28,.6);color:#b9c4d4;font:12px Consolas,monospace;white-space:nowrap;overflow:hidden;z-index:5}
  #perf b{color:#fff;font-weight:600}
  #perf b.ok{color:#7be08a} #perf b.warn{color:#ffd166} #perf b.bad{color:#ff6b5e}
  .perf #perf{display:flex}
  .perf #themes{top:34px}
  #life{position:fixed;top:12px;left:12px;color:#fff;font-weight:800;font-size:20px;letter-spacing:2px;white-space:pre;background:rgba(30,50,70,.45);padding:4px 12px;border-radius:10px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
  .perf #life{top:34px}
  #sign{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-size:44px;font-weight:800;text-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none}
  .embed #life,.embed #sign{display:none}
  /* Pekstyrning: halvgenomskinliga reglage, bara på pekskärm (klassen touch sätts i main.js). */
  #pad,#jump,#rotate{display:none}
  .touch{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  .touch #hint,.touch #edit{display:none}
  .touch #themes{top:calc(12px + env(safe-area-inset-top))}
  .touch.perf #themes{top:calc(34px + env(safe-area-inset-top))}
  .touch #pad,.touch #jump{display:flex;position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));touch-action:none;z-index:4}
  .touch #pad{left:calc(22px + env(safe-area-inset-left));gap:10px}
  .touch #jump{right:calc(26px + env(safe-area-inset-right))}
  #pad span,#jump{width:76px;height:76px;border-radius:50%;box-sizing:border-box;align-items:center;justify-content:center;display:flex;
    color:rgba(255,255,255,.8);font-size:30px;font-weight:800;background:rgba(30,50,70,.28);border:2px solid rgba(255,255,255,.45);pointer-events:none}
  #jump{width:92px;height:92px;pointer-events:auto}
  #pad[data-dir=l] .l,#pad[data-dir=r] .r,#jump.on{background:rgba(255,255,255,.4);border-color:#fff}
  @media (orientation:portrait){.touch #rotate{display:grid;position:fixed;inset:0;place-items:center;text-align:center;padding:24px;
    background:rgba(18,26,40,.88);color:#fff;font-size:20px;font-weight:800;z-index:9}}
</style>

  <link rel="modulepreload" crossorigin href="./assets/level-DRIMsCGR.js">

<body>
<div id="loading">Laddar…</div>
<div id="perf"></div>
<div id="themes"></div>
<div id="life" style="display:none"></div>
<div id="sign" style="display:none"></div>
<a id="edit" href="editor.html">Baneditor (E)</a>
<div id="hint">← → springa · mellanslag hoppa · E editor · F mätrad</div>
<div id="pad"><span class="l">◀</span><span class="r">▶</span></div>
<div id="jump">▲</div>
<div id="rotate">Vrid enheten till liggande läge</div>
</body>
